name: Build STS2 daily feed

on:
  schedule:
    # The main trigger is a launchd agent (scripts/install-launchd.sh) that
    # starts this workflow at 21:00 or 22:00 UTC. These runs are backups; GitHub
    # can delay them by hours or drop them. Re-runs produce the same feed.
    - cron: "17 22 * * *"  # 22:17 UTC
    - cron: "17 23 * * *"  # 23:17 UTC
  workflow_dispatch:
    inputs:
      repost:
        description: "Repost the latest daily so Slack posts it to the channel again"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate feed and page
        run: |
          mkdir -p public
          python3 sts2_daily.py --rss public/feed.xml --html public/index.html --lead-hours 6 \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            ${{ inputs.repost && '--repost' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
